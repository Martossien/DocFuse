name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy --strict src/docfuse/

      - name: Pytest
        run: pytest tests/ -v --tb=short

      - name: Recette (CdC §21.4)
        run: python tests/recette/run_recette.py

  license-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-licenses

      - name: Verify no GPL/AGPL dependencies
        run: |
          pip-licenses \
            --from=classifier \
            --allow-only="MIT;BSD;BSD-3-Clause;BSD-2-Clause;Apache Software License;Apache-2.0;ISC License;Mozilla Public License 2.0;Python Software Foundation License;Historical Permission Notice and Disclaimer (HPND)" \
            --packages pdfminer.six pypdf python-docx python-pptx openpyxl beautifulsoup4 lxml striprtf charset-normalizer reportlab customtkinter tkinterdnd2 tiktoken regex requests \
            || true
          # Le test automatisé dans test_acceptance.py est la vérification principale

  build-windows:
    needs: [lint-and-test, license-check]
    runs-on: windows-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: write # requis pour attacher le .zip a la Release (event "release" uniquement)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build Windows portable
        run: pyinstaller --noconfirm CorpusOne.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorpusOne-windows-x64
          path: dist/CorpusOne.exe
          if-no-files-found: error

      # Uniquement quand une Release GitHub est publiee (pas sur les push main) :
      # zippe l'exe, calcule le SHA-256, et attache les deux a la Release. Meme
      # convention de nommage que la v0.1.1 (upload manuel a l'epoque) :
      # CorpusOne-{version}-beta-windows-x64.zip + .zip.sha256.
      - name: Package and publish release asset
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $zipName = "CorpusOne-$version-beta-windows-x64.zip"
          Compress-Archive -Path dist/CorpusOne.exe -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          Set-Content -Path "$zipName.sha256" -Value "$hash  $zipName" -NoNewline -Encoding ascii
          gh release upload "${{ github.event.release.tag_name }}" $zipName "$zipName.sha256" --clobber --repo ${{ github.repository }}