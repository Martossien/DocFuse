name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy --strict src/docfuse/

      - name: Pytest
        run: pytest tests/ -v --tb=short

      - name: Recette (CdC §21.4)
        run: python tests/recette/run_recette.py

  license-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          pip install pip-licenses

      - name: Verify no GPL/AGPL dependencies
        # Porte réelle : la commande échouait toujours (« MIT License » n'était pas
        # dans la liste `--allow-only`, qui ne connaissait que « MIT ») et un
        # `|| true` la rendait inopérante. On liste les licences telles que les
        # paquets les déclarent (classifier, sinon métadonnée) et on refuse toute
        # mention GPL/AGPL/LGPL/propriétaire — même critère que
        # tests/test_acceptance.py::test_dependencies_licenses_compatible.
        run: |
          pip-licenses --from=mixed --format=csv \
            --packages pdfminer.six pypdf python-docx python-pptx openpyxl beautifulsoup4 lxml striprtf charset-normalizer reportlab customtkinter tkinterdnd2 tiktoken regex requests pypdfium2 pillow ftfy wcwidth office_oxide python-oxmsg click \
            | tee licenses.csv
          if grep -iE 'gpl|proprietary' licenses.csv; then
            echo "::error::dépendance sous licence interdite (voir ci-dessus)"; exit 1
          fi

  build-windows:
    needs: [lint-and-test, license-check]
    runs-on: windows-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: write # requis pour attacher le .zip a la Release (event "release" uniquement)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          pip install pyinstaller

      - name: Build Windows portable
        run: pyinstaller --noconfirm DocFuse.spec

      - name: Smoke test de l'exe (fenêtre construite puis fermée)
        # `DOCFUSE_GUI_SMOKE=1` : l'exe construit toute la fenêtre puis se ferme
        # seul — prouve que Tk, CustomTkinter et tkdnd sont embarqués. L'exe est
        # fenêtré (pas de console) : PowerShell ne l'attendrait pas sans
        # `Start-Process -Wait`.
        timeout-minutes: 5
        shell: pwsh
        env:
          DOCFUSE_GUI_SMOKE: "1"
        run: |
          $p = Start-Process -FilePath "dist\DocFuse.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "l'exe a rendu $($p.ExitCode)"; exit $p.ExitCode }

      - name: Smoke test de l'exe (extraction réelle, pool de processus gelé)
        # D-111 : l'extraction tourne dans un pool de processus ; dans l'exe
        # onefile chaque travailleur est un relancement de DocFuse.exe que
        # `freeze_support` doit intercepter. Une extraction des fixtures par
        # l'exe prouve que ça marche gelé sous Windows — pas seulement en
        # tests Python. Sortie attendue : un corpus non vide.
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $p = Start-Process -FilePath "dist\DocFuse.exe" -ArgumentList @("--input", "tests\fixtures", "--output", "smoke\corpus.md", "--no-recursive", "--yes") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "l'extraction par l'exe a rendu $($p.ExitCode)"; exit $p.ExitCode }
          $corpus = Get-Item "smoke\corpus.md"
          if ($corpus.Length -lt 10000) { Write-Error "corpus trop court : $($corpus.Length) octets"; exit 1 }
          Write-Host "corpus extrait par l'exe : $($corpus.Length) octets"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFuse-windows-x64
          path: dist/DocFuse.exe
          if-no-files-found: error

      # Uniquement quand une Release GitHub est publiee (pas sur les push main) :
      # zippe l'exe, calcule le SHA-256, et attache les deux a la Release. Meme
      # convention de nommage que la v0.1.1 (upload manuel a l'epoque) :
      # DocFuse-{version}-beta-windows-x64.zip + .zip.sha256.
      - name: Package and publish release asset
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $zipName = "DocFuse-$version-beta-windows-x64.zip"
          Compress-Archive -Path dist/DocFuse.exe -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          Set-Content -Path "$zipName.sha256" -Value "$hash  $zipName" -NoNewline -Encoding ascii
          gh release upload "${{ github.event.release.tag_name }}" $zipName "$zipName.sha256" --clobber --repo ${{ github.repository }}

  # Variante avec Tesseract bundlé (OCR des PDF scannés, core/ocr/) —
  # exe distinct, publié en plus de DocFuse.exe sur la même Release.
  # DocFuse.exe (build-windows ci-dessus) n'embarque jamais Tesseract :
  # décision produit du 2026-08-29 (voir docs/journal-decisions.md), pour
  # ne pas alourdir/ralentir l'exe standard. Uniquement sur Release (build
  # plus long : téléchargement Tesseract + tessdata).
  build-windows-ocr:
    needs: [lint-and-test, license-check]
    runs-on: windows-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract (choco) + modèle français (tessdata_fast)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tessHome = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata" -OutFile "$tessHome\tessdata\fra.traineddata"
          & "$tessHome\tesseract.exe" --version
          & "$tessHome\tesseract.exe" --list-langs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          pip install pyinstaller

      - name: Build Windows portable (avec OCR)
        env:
          TESSERACT_HOME: C:\Program Files\Tesseract-OCR
        run: pyinstaller --noconfirm DocFuse-OCR.spec

      - name: Smoke test de l'exe (fenêtre construite puis fermée)
        # `DOCFUSE_GUI_SMOKE=1` : l'exe construit toute la fenêtre puis se ferme
        # seul — prouve que Tk, CustomTkinter et tkdnd sont embarqués. L'exe est
        # fenêtré (pas de console) : PowerShell ne l'attendrait pas sans
        # `Start-Process -Wait`.
        timeout-minutes: 5
        shell: pwsh
        env:
          DOCFUSE_GUI_SMOKE: "1"
        run: |
          $p = Start-Process -FilePath "dist\DocFuse-OCR.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "l'exe a rendu $($p.ExitCode)"; exit $p.ExitCode }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFuse-OCR-windows-x64
          path: dist/DocFuse-OCR.exe
          if-no-files-found: error

      - name: Package and publish release asset
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $zipName = "DocFuse-OCR-$version-beta-windows-x64.zip"
          Compress-Archive -Path dist/DocFuse-OCR.exe -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          Set-Content -Path "$zipName.sha256" -Value "$hash  $zipName" -NoNewline -Encoding ascii
          gh release upload "${{ github.event.release.tag_name }}" $zipName "$zipName.sha256" --clobber --repo ${{ github.repository }}